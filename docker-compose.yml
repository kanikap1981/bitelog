services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bitelog
      POSTGRES_USER: bitelog
      POSTGRES_PASSWORD: bitelog
    ports:
      - "5432:5432"
    volumes:
      - bitelog_pg:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bitelog
      MINIO_ROOT_PASSWORD: bitelogsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bitelog_minio:/data
volumes:
  bitelog_pg:
  bitelog_minio:
